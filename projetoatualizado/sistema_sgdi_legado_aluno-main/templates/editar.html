{% extends "base.html" %}
{% block content %}
<h2>Editar Demanda</h2>
<form method="POST" action="/editar/{{ demanda['id'] }}">
<div><label>Título:</label><br><input type="text" name="titulo" value="{{ demanda['titulo'] }}" size="50" required></div><br>
<div><label>Descrição:</label><br><textarea name="descricao" rows="5" cols="50">{{ demanda['descricao'] }}</textarea></div><br>
<div><label>Solicitante:</label><br><input type="text" name="solicitante" value="{{ demanda['solicitante'] }}" required></div><br>
<div><label>Prioridade:</label><br><select name="prioridade" required>
<option value="BAIXA" {% if demanda['prioridade']=='BAIXA' %}selected{% endif %}>BAIXA - Pode ser resolvida posteriormente, sem impacto imediato.</option>
<option value="MÉDIA" {% if demanda['prioridade']=='MÉDIA' %}selected{% endif %}>MÉDIA - Demanda importante, mas sem impacto crítico imediato.</option>
<option value="ALTA" {% if demanda['prioridade']=='ALTA' %}selected{% endif %}>ALTA - Demanda urgente ou com grande impacto no funcionamento do sistema.</option>
</select></div><br>
<div><label>Responsável:</label><br><input type="text" name="responsavel" value="{{ demanda['responsavel'] }}" size="50" required></div><br>
<div><label>Data de Criação:</label><br><input type="text" value="{{ demanda['data_criacao'] }}" disabled></div><br>
<button type="submit">Atualizar</button> <a href="/"><button type="button">Cancelar</button></a>
</form>
{% endblock %}
